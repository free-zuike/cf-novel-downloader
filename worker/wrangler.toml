name = "novel-downloader"
main = "src/index.ts"
compatibility_date = "2024-06-15"
compatibility_flags = ["nodejs_compat"]

[site]
bucket = "./web/dist"

[[d1_databases]]
binding = "DB"
database_name = "novel-db"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "novel-downloads"

[ai]
binding = "AI"

[observability]
enabled = true
